# 임시: 네이버 리서치 받아오기 시험 (PR 전에 지워요)
name: reading-try
on:
  push:
    branches: [claude/project-thread-177r8e]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          from playwright.sync_api import sync_playwright
          seen = []
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page()
              def on(r):
                  ct = r.headers.get("content-type", "")
                  if r.request.resource_type in ("xhr", "fetch") or "json" in ct:
                      body = ""
                      try:
                          body = r.text()[:600]
                      except Exception as e:
                          body = str(e)
                      seen.append((r.request.method, r.url, ct, body))
              pg.on("response", on)
              pg.goto("https://finance.naver.com/research/market_info_list.naver", wait_until="networkidle", timeout=60000)
              pg.wait_for_timeout(3000)
              for m, u, ct, body in seen:
                  print("##", m, u, ct)
                  print(body)
              links = pg.eval_on_selector_all("a", "els => els.map(e => e.href).filter(h => /pdf|research|nid/i.test(h)).slice(0, 15)")
              print("LINKS", links)
              print(pg.inner_text("body")[:1500])
          PY
      - run: python reading.py --out /tmp/r.json
      - run: python -c "import json;d=json.load(open('/tmp/r.json'));[print(k, x) for k in d['items'] for x in d['items'][k][:3]]"
