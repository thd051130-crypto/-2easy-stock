# 임시: 네이버 리서치 받아오기 시험 (PR 전에 지워요)
name: reading-try
on:
  push:
    branches: [claude/project-thread-177r8e]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: |
          python - <<'PY'
          import requests, json
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36", "Referer": "https://stock.naver.com/research"}
          for c in ["market", "invest", "economy", "industry", "debenture", "bond", "company", "daily", "strategy"]:
              r = requests.get(f"https://stock.naver.com/api/stockSecurity/researches/v2/{c}?index=0&size=2", headers=H, timeout=20)
              print("##", c, r.status_code)
              try:
                  d = r.json()
                  it = (d.get("items") or [{}])[0]
                  print({k: (str(v)[:120]) for k, v in it.items()})
              except Exception as e:
                  print(r.text[:200])
          PY
      - run: python reading.py --out /tmp/r.json
      - run: python -c "import json;d=json.load(open('/tmp/r.json'));[print(k, x) for k in d['items'] for x in d['items'][k][:3]]"
