# 임시: 네이버 리서치 받아오기 시험 (PR 전에 지워요)
name: reading-try
on:
  push:
    branches: [claude/project-thread-177r8e]
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests playwright && python -m playwright install --with-deps chromium
      - run: |
          python - <<'PY'
          import requests
          from playwright.sync_api import sync_playwright
          from reading import API, HEADERS
          with sync_playwright() as p:
              b = p.chromium.launch()
              pg = b.new_page()
              for path in ["market", "invest", "economy", "industry", "debenture"]:
                  it = requests.get(API.format(cat=path, n=1), headers=HEADERS, timeout=20).json()["items"][0]
                  for cand in [path, "daily", "invest", "economy", "industry", "debenture"]:
                      url = f"https://stock.naver.com/research/{cand}/{it['nid']}"
                      try:
                          pg.goto(url, wait_until="networkidle", timeout=30000)
                          ok = it["title"][:12] in pg.inner_text("body")
                      except Exception as e:
                          ok = f"err {e}"
                      print("URL", path, cand, ok, url)
          PY
      - run: python reading.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add paper/reading.json && git commit -m "시험: 실제 리포트 자료" && git push
