# 임시: 네이버 리서치 받아오기 시험 (PR 전에 지워요)
name: reading-try
on:
  push:
    branches: [claude/project-thread-177r8e]
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: |
          python - <<'PY'
          import requests, re
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/126 Safari/537.36"}
          t = requests.get("https://finance.naver.com/research/market_info_list.naver", headers=H, timeout=20).content.decode("utf-8", "replace")
          for k in [".pdf", "__NEXT_DATA__", "nid", "/api/", "self.__next_f"]:
              idx = [m.start() for m in re.finditer(re.escape(k), t)][:3]
              print("==", k, len(re.findall(re.escape(k), t)))
              for x in idx[:2]:
                  print(repr(t[max(0, x - 400): x + 300]))
          print(sorted(set(re.findall(r'https?://[a-zA-Z0-9.\-]+/[a-zA-Z0-9_/\-]*api[a-zA-Z0-9_/\-]*', t)))[:30])
          PY
      - run: python reading.py --out /tmp/r.json
      - run: python -c "import json;d=json.load(open('/tmp/r.json'));[print(k, x) for k in d['items'] for x in d['items'][k][:3]]"
