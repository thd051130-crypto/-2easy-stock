# 종목 화면 재무제표(PER·PBR·매출·영업이익)를 매주 야후 파이낸스에서 받아 paper/<시장>/fundamentals.json에 저장해요.
#   재무는 분기마다 바뀌어서 일주일에 한 번이면 충분해요. 저장(커밋)하면 pages가 대시보드를 다시 올려요.
#   폰에서 바로 돌려 보기: GitHub 앱/모바일 브라우저 → Actions → fundamentals → Run workflow
name: fundamentals

on:
  schedule:
    - cron: "0 0 * * 6"  # UTC 토요일 00:00 = 한국 토요일 09:00
  workflow_dispatch:

permissions:
  contents: write  # paper/ 재무 파일을 커밋해요

concurrency:
  group: fundamentals
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python fundamentals.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/kr/fundamentals.json paper/us/fundamentals.json
          if git diff --cached --quiet; then echo "재무 변화 없음"; exit 0; fi
          git commit -m "재무제표 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
