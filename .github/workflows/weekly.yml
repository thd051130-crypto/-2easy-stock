# 주간 리포트: 토요일 아침에 한 주(지수·업종·종목·사건)와 다음 주 일정을 한 장으로 묶어 텔레그램으로 보내요.
#   미장 금요일 자료(daily 07:30)가 들어온 뒤 한국시간 토요일 09:30쯤. 앱 리포트 화면 '주간 리포트' 탭에도 나와요.
#   사고팔기 판단은 안 해요. 이미 저장된 자료만 읽어서 새로 받지 않아요.
# 폰에서 바로 돌려 보기: GitHub 앱/모바일 브라우저 → Actions → weekly → Run workflow
# 필요한 저장소 Secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID
name: weekly

on:
  schedule:
    - cron: "30 0 * * 6"  # UTC 토요일 00:30 = 한국 토요일 09:30
  workflow_dispatch:

permissions:
  contents: write  # paper/weekly.json, 메시지함을 커밋해요
  actions: read  # 고장 알림이 바로 전 실행 결과를 봐요

concurrency:
  group: daily  # 매일 자료와 겹치지 않게 같은 줄에 서요
  cancel-in-progress: false

jobs:
  weekly:
    runs-on: ubuntu-24.04  # GitHub가 10-19부터 ubuntu-latest를 26으로 바꿔요. 검증된 24.04에 고정
    timeout-minutes: 10
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 주간 리포트
        run: python weekly.py
      - name: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add paper/weekly.json paper/inbox
          if git diff --cached --quiet; then echo "기록 변화 없음"; exit 0; fi
          git commit -m "주간 리포트 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
      - name: 고장 알림
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python health.py fail --workflow weekly
