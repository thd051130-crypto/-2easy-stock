name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest matplotlib koreanize-matplotlib
      - run: python -m pytest -v
      - run: python flows.py --code 005930 && python flows.py --out /tmp/flows.json && python -c "import json,flows;d=json.load(open('/tmp/flows.json'));print(d['day'],len(d['stocks']));print(flows.warnings(d)[:3]);print(flows.top_flows(d))"
        continue-on-error: true
      - run: python econ_calendar.py --save /tmp/cal.json --dry-run && python -c "import json;d=json.load(open('/tmp/cal.json'));print(d['fomc']);print(d['bok'])"
        continue-on-error: true
