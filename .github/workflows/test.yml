name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pip install pytest matplotlib koreanize-matplotlib
      - run: python -m pytest -v
      - run: python -c "import requests,re;t=requests.get('https://www.federalreserve.gov/monetarypolicy/fomccalendars.htm',headers={'User-Agent':'Mozilla/5.0'},timeout=20).text;i=t.find('2027 FOMC Meetings');print(t[i:i+6000]);j=t.find('2025 FOMC Meetings');k=t.find('August',j);print('=====AUG2025');print(t[k-1500:k+800])"
        continue-on-error: true
