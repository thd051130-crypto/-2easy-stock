name: tmp-probe
on:
  push:
    branches: [claude/project-thread-csxn34]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pandas
      - run: |
          python econ_calendar.py --save /tmp/cal.json --dry-run | head -30
          python -c "
          import json;c=json.load(open('/tmp/cal.json'));print(len(c['releases']));[print(e['date'],e['title'],e['note']) for e in c['events'] if e['kind']=='big']"
