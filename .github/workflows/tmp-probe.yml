name: tmp-probe
on:
  push:
    branches: [claude/project-thread-csxn34]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          UA="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36"
          for u in "https://fred.stlouisfed.org/releases/calendar?rid=10&y=2026" \
                   "https://fred.stlouisfed.org/releases/calendar?y=2026&m=11" \
                   "https://fred.stlouisfed.org/releases/calendar?vs=2026-11-01&ve=2026-11-30" \
                   "https://www.bea.gov/news/schedule" \
                   "https://www.bls.gov/schedule/news_release/bls.ics" \
                   "https://www.bls.gov/schedule/2026/home.htm" \
                   "https://api.nasdaq.com/api/calendar/economicevents?date=2026-11-13" ; do
            for h in "" "$UA"; do
              code=$(curl -sS -L -m 25 -o out.txt -w '%{http_code}' ${h:+-A "$h"} -H 'Accept: */*' "$u" || true)
              echo "=== $u UA=${h:+yes} -> $code $(wc -c < out.txt)"
              grep -o -i -E '.{0,120}(Consumer Price|Employment Situation|Personal Income|Gross Domestic|CPI).{0,160}' out.txt | head -8
            done
          done
