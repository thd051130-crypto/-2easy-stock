# 백테스트 (공부용): 전략을 과거 일봉으로 돌려 보고 요약 몇 줄만 남겨요. Claude 토큰을 거의 안 써요.
#   폰에서: GitHub 앱/모바일 브라우저 → Actions → backtest → Run workflow → (칸 채우기) → Run
#   결과: 그 실행을 눌러 맨 위 요약(Summary)에서 보기 · 저장소 backtest/LATEST.md · 자세한 숫자 backtest/results/
#   일봉은 backtest/prices/에 쌓아 두고 다음부터 새 날짜만 받아요. 전략 목록은 backtest/strategies.json.
name: backtest

on:
  workflow_dispatch:
    inputs:
      strategy:
        description: "전략 이름 (빈칸이나 all = 전부 비교, 여러 개는 띄어서)"
        required: false
        default: "all"
      mix:
        description: "파일 안 고치고 바로 섞기 (예: sp500:60,usmid:40). 적으면 위 칸은 무시"
        required: false
        default: ""
      rebalance:
        description: "섞기용 맞추기: M 매달 · Q 분기 · Y 매년 · N 안 함"
        required: false
        default: "Q"
      start:
        description: "시작일 (예: 2010-01-01, 빈칸 = 자료 처음부터)"
        required: false
        default: ""

permissions:
  contents: write  # backtest/ 일봉·결과를 커밋해요

concurrency:
  group: backtest
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      PYTHONUNBUFFERED: "1"
      STRATEGY: ${{ inputs.strategy }}
      MIX: ${{ inputs.mix }}
      REBALANCE: ${{ inputs.rebalance }}
      START: ${{ inputs.start }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install pandas numpy yfinance
      - name: 백테스트
        run: |
          args=()
          if [ -n "$MIX" ]; then args+=(--mix "$MIX" --rebalance "${REBALANCE:-Q}")
          else read -ra names <<< "${STRATEGY:-all}"; args+=("${names[@]}"); fi
          if [ -n "$START" ]; then args+=(--start "$START"); fi
          set +e
          python backtest.py "${args[@]}" > out.txt 2>&1
          code=$?
          set -e
          grep -v "Crumb" out.txt | tail -n 15 | tee short.txt  # 오류가 나도 마지막 몇 줄만
          { echo '### 백테스트 결과'; echo '```'; cat short.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit $code
      - name: commit
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backtest/prices backtest/results backtest/LATEST.md 2>/dev/null || true
          if git diff --cached --quiet; then echo "바뀐 것 없음"; exit 0; fi
          git commit -m "백테스트 $(TZ=Asia/Seoul date '+%F %H:%M')"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
