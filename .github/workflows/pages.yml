# 폰으로 보는 대시보드를 GitHub Pages에 올려요 (site/ 화면 + paper/ 기록으로 만든 data.json + 종목 화면 파일).
#   - swing-signals·fundamentals가 끝날 때마다, main에 화면·기록이 바뀔 때마다 다시 올려요.
#     텔레그램 봇(telegram-bot)은 관심종목·알림을 바꾸면 이 워크플로를 직접 돌려요.
#   - 처음 한 번: 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꿔야 올라가요.
#   - 주소: https://<계정>.github.io/<저장소>/  (폰 브라우저에서 열고 "홈 화면에 추가")
name: pages

on:
  workflow_run:
    workflows: [swing-signals, fundamentals, macro, world, all-stocks]  # 봇 커밋은 push 이벤트를 안 일으켜서 끝나는 걸 봐요
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", "paper/**", "dashboard.py", "policies.py", "world.py", "econ_calendar.py", "themes.py", "industry_map.py", "stock_pages.py", "fundamentals.py", "flows.py", "watchlist.py", "strategy.py", "markets.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  actions: read  # 고장 알림이 바로 전 실행 결과를 봐요

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # swing-signals가 방금 커밋한 최신 기록
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python dashboard.py --out _site
      # 전 종목 종목 화면(all-stocks 워크플로가 올린 최근 2년 일봉 + 월봉). 대시보드 종목은 다음 줄이 상장일부터 받은 파일로 덮어써요
      - name: 전 종목 차트 파일
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for m in kr us; do
            id=$(gh api "repos/${{ github.repository }}/actions/artifacts?name=stocks-$m&per_page=20" \
              --jq '[.artifacts[] | select(.expired | not)] | sort_by(.created_at) | last | .id // empty')
            if [ -z "$id" ]; then echo "$m 전 종목 파일 없음 (all-stocks가 아직 안 돌았어요)"; continue; fi
            gh api "repos/${{ github.repository }}/actions/artifacts/$id/zip" > "/tmp/$m.zip"
            mkdir -p "_site/stocks/$m" && unzip -o -q "/tmp/$m.zip" -d "/tmp/$m" && tar xzf "/tmp/$m/stocks-$m.tgz" -C "_site/stocks/$m"
            echo "$m 전 종목 파일 $(ls "_site/stocks/$m" | wc -l)개"
          done
      # 종목 화면(차트·재무제표)과 차트 화면 세계 지수 파일: 야후에서 처음부터 일봉을 받아요. 못 받아도 대시보드는 올려요
      - run: python stock_pages.py --out _site
        continue-on-error: true
        timeout-minutes: 6
      # 산업 지도: 산업 대표 종목 시세로 5일 흐름·주가 동행을 채워요. 못 받아도 점·선 지도는 떠요
      - run: python industry_map.py --out _site
        continue-on-error: true
        timeout-minutes: 3
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: 고장 알림
        if: failure()
        env:
          GITHUB_TOKEN: ${{ github.token }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python health.py fail --workflow pages
