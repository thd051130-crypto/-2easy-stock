# 폰으로 보는 대시보드를 GitHub Pages에 올려요 (site/ 화면 + paper/ 기록으로 만든 data.json).
#   - swing-signals가 끝날 때마다, main에 화면·기록이 바뀔 때마다 다시 올려요.
#   - 처음 한 번: 저장소 Settings → Pages → Source를 "GitHub Actions"로 바꿔야 올라가요.
#   - 주소: https://<계정>.github.io/<저장소>/  (폰 브라우저에서 열고 "홈 화면에 추가")
name: pages

on:
  workflow_run:
    workflows: [swing-signals]
    types: [completed]
  push:
    branches: [main]
    paths: ["site/**", "paper/**", "dashboard.py", "strategy.py", "markets.py", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main  # swing-signals가 방금 커밋한 최신 기록
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python dashboard.py --out _site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
