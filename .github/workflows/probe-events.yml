name: probe-events
on:
  push:
    branches: [claude/project-thread-n9ny6i]
    paths: [".github/workflows/probe-events.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36'
          for u in \
            "https://nfs.faireconomy.media/ff_calendar_thisweek.json" \
            "https://nfs.faireconomy.media/ff_calendar_nextweek.json" \
            "https://www.bls.gov/schedule/news_release/bls.ics" \
            "https://www.bls.gov/schedule/news_release/cpi.htm" \
            "https://www.bls.gov/schedule/2026/home.htm" \
            "https://fred.stlouisfed.org/releases/calendar?rid=10&y=2026" \
            "https://fred.stlouisfed.org/release/tables?rid=10" \
            "https://fred.stlouisfed.org/graph/fredgraph.csv?id=CPIAUCSL" \
            "https://fred.stlouisfed.org/graph/fredgraph.csv?id=PAYEMS" \
            "https://www.bea.gov/news/schedule" \
            "https://news.google.com/rss/search?q=CPI+inflation&hl=en-US&gl=US&ceid=US:en" ; do
            code=$(curl -s -L -o /tmp/out -w '%{http_code}' -m 20 -A "$UA" "$u"); echo "=== $code $(wc -c </tmp/out) $u"
            head -c 600 /tmp/out | tr '\n' ' '; echo
          done
          echo "=== FF high USD"
          curl -s -m 20 -A "$UA" https://nfs.faireconomy.media/ff_calendar_thisweek.json | python3 -c "import json,sys;[print(x) for x in json.load(sys.stdin) if x.get('impact')=='High']" || true
          echo "=== FRED cal CPI dates"
          curl -s -L -m 20 -A "$UA" "https://fred.stlouisfed.org/releases/calendar?rid=10&y=2026" | grep -oE '(January|February|March|April|May|June|July|August|September|October|November|December) [0-9]{1,2}, 2026' | sort -u | head -40 || true
          echo "=== FRED cal NFP dates"
          curl -s -L -m 20 -A "$UA" "https://fred.stlouisfed.org/releases/calendar?rid=50&y=2026" | grep -oE '(January|February|March|April|May|June|July|August|September|October|November|December) [0-9]{1,2}, 2026' | sort -u | head -40 || true
          echo "=== BLS ics"
          curl -s -m 20 -A "$UA" https://www.bls.gov/schedule/news_release/bls.ics | grep -A3 -i "consumer price" | head -30 || true
          echo "=== CPI tail"; curl -s -m 20 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=CPIAUCSL" | tail -15
          echo "=== core tail"; curl -s -m 20 "https://fred.stlouisfed.org/graph/fredgraph.csv?id=CPILFESL" | tail -15
