name: probe-events
on:
  push:
    branches: [claude/project-thread-n9ny6i]
    paths: [".github/workflows/probe-events.yml"]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/126 Mobile Safari/537.36'
          for rid in 10 50 54 53; do echo "=== rid $rid"; curl --http1.1 -s -L -m 25 "https://fred.stlouisfed.org/releases/calendar?rid=$rid&y=2026" -o /tmp/c; wc -c </tmp/c; grep -oE '(January|February|March|April|May|June|July|August|September|October|November|December) [0-9]{1,2}, 2026' /tmp/c | sort -u | head -30; grep -oE 'releases/calendar[^"]{0,80}' /tmp/c | head -5; done
          echo "=== api releases dates nokey"; curl --http1.1 -s -m 20 "https://api.stlouisfed.org/fred/release/dates?release_id=10&include_release_dates_with_no_data=true" | head -c 400; echo
          echo "=== BEA"; curl -s -m 20 https://www.bea.gov/news/schedule | grep -oE '(Personal Income and Outlays|GDP \(Advance|Gross Domestic Product)[^<]{0,80}' | head
