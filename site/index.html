<script>
// 첫 화면 빨리 띄우기 (2026-11-18): app.js(큰 파일)를 받는 동안 data.json·뉴스를 같이 받기 시작해요.
// 아래 대기화면의 가로 진행률 막대도 여기서 움직여요 (받은 양 기준). app.js가 BOOT.data를 이어받아요.
(function () {
  var B = window.BOOT = { got: 0, need: 0, app: 0, shown: 0 };
  var bar = null, pct = null;
  function paint() {
    bar = bar || document.querySelector(".boot-fill"); pct = pct || document.querySelector(".boot-pct");
    var f = B.need ? Math.min(1, B.got / B.need) : 0;
    var p = Math.round(8 + 72 * f + 18 * B.app);  // 화면 8 → 자료 받기 72 → 앱 준비 18
    if (p > 99) p = 99;
    if (p <= B.shown) return;
    B.shown = p;
    if (bar) bar.style.transform = "scaleX(" + p / 100 + ")";
    if (pct) pct.textContent = p + "%";
  }
  B.step = function () { B.app = 1; paint(); };
  B.paint = paint;
  try { B.need = +localStorage.getItem("data_bytes") || 750000; } catch (e) { B.need = 750000; }
  B.data = fetch("data.json", { cache: "no-cache" }).then(function (r) {
    if (!r.ok) throw new Error(r.status);
    if (!r.body || !window.TextDecoder) return r.json();
    var rd = r.body.getReader(), parts = [];
    return (function pump() {
      return rd.read().then(function (x) {
        if (x.done) {
          var all = new Uint8Array(B.got), o = 0;
          parts.forEach(function (c) { all.set(c, o); o += c.length; });
          try { localStorage.setItem("data_bytes", String(B.got)); } catch (e) { }
          return JSON.parse(new TextDecoder().decode(all));
        }
        parts.push(x.value); B.got += x.value.length; paint();
        return pump();
      });
    })();
  });
  try { B.newsUrl = localStorage.getItem("news_url"); } catch (e) { }
  if (B.newsUrl == null) B.newsUrl = "https://raw.githubusercontent.com/thd051130-crypto/-2easy-stock/live/news.json";  // 처음 연 폰도 바로 (app.js가 data.json 주소와 맞는지 확인해요)
  if (B.newsUrl) B.news = fetch(B.newsUrl + "?t=" + Date.now(), { cache: "no-store" })
    .then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
})();
</script>
